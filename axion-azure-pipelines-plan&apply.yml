trigger: none

pool:
  name: abhi_agent

variables:
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/env/dev'

  azureServiceConnection: 'abhi_azure_connection'
  azureSubscriptionId: 'cf72e154-d368-4a84-87cf-577efd0a8880'

  backendResourceGroup: 'dev-backend'
  backendStorageAccount: 'devstrgaks'
  backendContainer: 'tfstate'
  backendKey: 'vms/terraform.tfstate'


stages:

- stage: terraform_plan
  displayName: Terraform Init Validate Plan

  jobs:

  - job: terraform
    displayName: Terraform

    steps:

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(terraformWorkingDirectory)'

        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmOverrideSubscriptionID: '$(azureSubscriptionId)'
        backendAzureRmResourceGroupName: '$(backendResourceGroup)'
        backendAzureRmStorageAccountName: '$(backendStorageAccount)'
        backendAzureRmContainerName: '$(backendContainer)'
        backendAzureRmKey: '$(backendKey)'


    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(terraformWorkingDirectory)'


    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(terraformWorkingDirectory)'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'